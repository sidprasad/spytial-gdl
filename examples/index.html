<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examples · spytial-gdl</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <style>
    :root { --page-w: 880px; }
    main { width: 100%; max-width: var(--page-w); margin: 0 auto; padding: 0 28px 100px; }

    .head { padding: 60px 0 44px; }
    .head h1 { margin: 0 0 18px; font-size: clamp(34px, 6vw, 52px); }
    .head p { font-size: 19px; line-height: 1.45; color: var(--ink-2); max-width: 46ch; margin: 0; }

    section h2 {
      font: 500 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.18em;
      color: var(--ink); margin: 44px 0 14px;
    }
    #status { font: 11px var(--mono); color: var(--ink-3); margin-top: 36px; }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="../">
        <svg class="mark" viewBox="0 0 62 24" aria-hidden="true">
          <path class="axis" d="M4 12 H58" />
          <rect class="n-blue"   x="2"  y="6" width="14" height="12" />
          <rect class="n-red"    x="22" y="6" width="18" height="12" />
          <rect class="n-yellow" x="46" y="6" width="14" height="12" />
        </svg>
        spytial-gdl
      </a>
      <nav>
        <a href="../docs/">Docs</a>
        <a href="../playground/">Playground</a>
        <a href="../GUIDE.md">Guide</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="head">
      <h1>Examples</h1>
      <p>One page per way of getting a diagram onto a page. Each is a single
         self-contained file — view source and copy what you need.</p>
    </div>

    <section id="html"><h2>Pages</h2><ul class="tiles"></ul></section>
    <section id="md"><h2>Markdown</h2><ul class="tiles"></ul></section>
    <p id="status">loading…</p>
  </main>

  <script type="module">
    // One blurb per example. Anything discovered without an entry still shows up,
    // titled from its filename — so adding an example needs no edit here.
    const DESCRIPTIONS = {
      'drop-in.html': ['Script tag', 'One tag and a &lt;div&gt;. No build step, no init call.'],
      'binary-tree.html': ['JavaScript API', 'Render, re-render, and read the result from code.'],
      'editable.html': ['Reading edits back', 'Edit the graph; getSource() and getValue() follow.'],
      'two-way-editing.html': ['Two-way editing, at length', 'A longer walk through editing from either side.'],
      'conflict.html': ['Unsatisfiable constraints', 'What you see when the spatial rules cannot all hold.'],
      'guide.html': ['GUIDE.md, rendered', 'The embedding guide, with its diagrams live.'],
      'your-diagram-doesnt-know.md': ['Your diagram doesn’t know it’s a family tree',
        'An essay on what a flowchart leaves out.'],
    };
    // Pages that are infrastructure, not demos.
    const HIDE = new Set(['index.html', 'md-viewer.html']);

    // Fallback when there's no directory-listing server (e.g. opened from a CDN/package).
    const FALLBACK = Object.keys(DESCRIPTIONS);

    const titleize = (f) => f.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');

    function item(file, n) {
      const [name, desc] = DESCRIPTIONS[file] || [titleize(file), ''];
      const href = file.endsWith('.md') ? `md-viewer.html?doc=${encodeURIComponent(file)}` : file;
      const li = document.createElement('li');
      li.innerHTML =
        `<a href="${href}">` +
          `<span class="tile-num">${String(n).padStart(2, '0')}</span>` +
          `<span><span class="tile-name">${name}<span class="tile-file">${file}</span></span>` +
          (desc ? `<p class="tile-desc">${desc}</p>` : '') + `</span>` +
          `<span class="tile-arrow" aria-hidden="true">→</span>` +
        `</a>`;
      return li;
    }

    let files;
    try {
      const res = await fetch('./?list');
      const ct = res.headers.get('content-type') || '';
      if (!res.ok || !ct.includes('json')) throw new Error('no listing');
      files = await res.json();
      document.getElementById('status').textContent = `${files.length} files in examples/`;
    } catch {
      files = FALLBACK;
      document.getElementById('status').textContent = 'static listing (no preview server)';
    }

    // Order by the blurb table, which reads roughly easiest-first; anything the
    // table doesn't know about lands at the end.
    const order = Object.keys(DESCRIPTIONS);
    const rank = (f) => (order.indexOf(f) === -1 ? order.length : order.indexOf(f));
    const visible = files.filter((f) => !HIDE.has(f) && /\.(html|md)$/.test(f))
                         .sort((a, b) => rank(a) - rank(b));

    const htmlUl = document.querySelector('#html ul');
    const mdUl = document.querySelector('#md ul');
    let n = 0;
    for (const f of visible) (f.endsWith('.md') ? mdUl : htmlUl).appendChild(item(f, ++n));
    if (!htmlUl.children.length) document.getElementById('html').remove();
    if (!mdUl.children.length) document.getElementById('md').remove();
  </script>
</body>
</html>
