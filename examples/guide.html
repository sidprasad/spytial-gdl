<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spytial-gdl · embedding guide</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <style>
    body { max-width:780px; margin:0 auto; padding:40px 24px 96px; }
    h1 { font-size:clamp(32px,6vw,46px); margin:0 0 10px; }
    h2 { font-size:25px; margin:44px 0 12px; }
    h3 { margin:26px 0 8px; }
    p { margin:12px 0; }
    pre { padding:14px 16px; overflow-x:auto; font-size:12.5px; line-height:1.55; }
    table { border-collapse:collapse; width:100%; font-size:14px; margin:14px 0 22px; }
    td { border-top:1px solid var(--hair); padding:8px 10px; vertical-align:top; }
    td:first-child { white-space:nowrap; }
    th { text-align:left; padding:7px 10px; border-bottom:1px solid var(--hair);
         font:600 14px/1.4 var(--sans); }
    webcola-cnd-graph { display:block; width:100%; height:100%; }
    footer { margin-top:56px; color:var(--ink-3); font-size:13px; border-top:1px solid var(--hair); padding-top:16px; }
  </style>

  <!-- Only marked is loaded here. The spytial-core renderer bundle is
       injected on demand by renderSpytialGdls — that's the single-import story
       this guide describes, dogfooded. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="../">Spytial GDL</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../playground/">Examples</a>
      <a href="../docs/#/embedding">Embed</a>
      <a href="../docs/">Docs</a>
    </nav>
  </header>
  <div id="doc"><p style="color:var(--ink-3)">Loading the guide…</p></div>
  <footer>Source: <a href="../GUIDE.md">GUIDE.md</a> · <a href="../playground/">open the playground</a></footer>

  <script type="module">
    import { renderSpytialGdls } from '../src/markdown.js';

    try {
      const md = await (await fetch('../GUIDE.md')).text();
      document.getElementById('doc').innerHTML = marked.parse(md);
      // Renders every ```spytial-gdl block and injects the engine if needed.
      await renderSpytialGdls(document.getElementById('doc'), { height: 300 });
    } catch (err) {
      console.error(err);
      document.getElementById('doc').innerHTML =
        `<p style="color:#b00020">Failed to load: ${err.message}</p>`;
    }
  </script>
</body>
</html>
